<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel Studio</title>
<style>
  /* ── Design tokens ── */
  :root {
    /* Colors (OKLCH, warm-tinted neutrals) */
    --bg-chrome: oklch(0.13 0.005 60);
    --bg-page: oklch(0.16 0.005 60);
    --bg-card: oklch(0.14 0.005 60);
    --bg-input: oklch(0.11 0.005 60);
    --border: oklch(0.25 0.005 60);
    --text: oklch(0.90 0.005 60);
    --text-muted: oklch(0.62 0.005 60);
    --accent: oklch(0.72 0.12 70);
    --accent-text: oklch(0.15 0.005 60);
    --danger: oklch(0.65 0.15 25);
    --success: oklch(0.70 0.12 145);
    --warning: oklch(0.72 0.12 50);
    /* Spacing scale (4px base) */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
    /* Radius */
    --r-sm: 4px; --r-md: 6px; --r-lg: 8px;
    /* Typography */
    --font-prose: Georgia, "Times New Roman", serif;
    --font-prose-ar: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
    --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  }
  @supports not (color: oklch(0 0 0)) {
    :root {
      --bg-chrome: #1e1e1e; --bg-page: #252525; --bg-card: #222; --bg-input: #1a1a1a;
      --border: #3a3a3a; --text: #e8e8e8; --text-muted: #9a9a9a;
      --accent: #c9a227; --accent-text: #1a1a1a; --danger: #c0392b;
      --success: #27ae60; --warning: #e67e22;
    }
  }

  /* ── Reset ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { font-family: var(--font-ui); background: var(--bg-chrome); color: var(--text);
    height: 100vh; overflow: hidden; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 48px 1fr;
    height: 100vh;
  }
  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: var(--sp-3);
    padding: 0 var(--sp-4); height: 48px;
    border-bottom: 1px solid var(--border); background: var(--bg-chrome);
  }
  .topbar .wordmark {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0;
  }
  .topbar .project-select {
    padding: 4px 8px; background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; cursor: pointer; max-width: 160px;
  }
  .topbar .new-btn {
    padding: 4px 8px; background: transparent; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    cursor: pointer; font-size: 12px; transition: color 100ms, border-color 100ms;
  }
  .topbar .new-btn:hover { color: var(--text); border-color: var(--accent); }
  .topbar .nav {
    display: flex; align-items: center; gap: var(--sp-2);
    flex: 1; justify-content: center;
  }
  .topbar .nav button {
    padding: 4px 10px; background: transparent; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    cursor: pointer; font-size: 13px; min-height: 28px;
    transition: color 100ms, border-color 100ms, background-color 100ms;
  }
  .topbar .nav button:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  .topbar .nav button:disabled { opacity: 0.35; cursor: not-allowed; }
  .topbar .nav select {
    padding: 4px 8px; background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    font-size: 13px; cursor: pointer;
  }
  .topbar .nav-label {
    font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .topbar .status {
    font-size: 12px; color: var(--text-muted); flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .left {
    padding: var(--sp-5) var(--sp-5); overflow-y: auto;
    border-right: 1px solid var(--border); background: var(--bg-chrome);
  }
  .right {
    padding: var(--sp-3); overflow-y: auto;
    background: var(--bg-card); font-size: 13px;
  }

  /* ── Page (scene prose) ── */
  .page {
    background: var(--bg-page); border-radius: var(--r-lg);
    padding: var(--sp-5) var(--sp-6); margin-bottom: var(--sp-4);
    border-inline-start: 1px solid var(--border);
    max-width: 65ch; margin-inline: auto;
  }
  .page-toolbar {
    display: flex; justify-content: flex-end; gap: var(--sp-2);
    margin-bottom: var(--sp-3);
  }
  .page-toolbar button {
    padding: 3px 8px; background: transparent; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    cursor: pointer; font-size: 11px; transition: color 100ms, border-color 100ms;
  }
  .page-toolbar button:hover { color: var(--text); border-color: var(--accent); }
  .page-toolbar .save-btn { background: var(--accent); color: var(--accent-text); border: none; font-weight: 600; }
  .page-toolbar .save-btn:hover { opacity: 0.9; }
  .scene {
    font-family: var(--font-prose); font-size: 18px; line-height: 1.75;
    color: var(--text); white-space: pre-wrap; word-wrap: break-word;
  }
  [dir="rtl"] .scene { font-family: var(--font-prose-ar); }
  [dir="rtl"] .page { border-inline-start: none; border-inline-end: 1px solid var(--border); }
  .scene:empty::before {
    content: "No scenes yet. Type a direction below and click Generate to write your first scene.";
    color: var(--text-muted); font-style: italic;
  }
  .scene-edit {
    display: none; width: 100%; min-height: 300px;
    padding: var(--sp-4); background: var(--bg-input); color: var(--text);
    border: 1px solid var(--accent); border-radius: var(--r-md);
    font-family: var(--font-prose); font-size: 18px; line-height: 1.75;
    resize: vertical;
  }
  .scene-edit:focus { outline: none; }

  /* ── Progress ── */
  .progress-wrap {
    height: 3px; background: var(--border); border-radius: 2px;
    margin-bottom: var(--sp-3); overflow: hidden; display: none;
  }
  .progress-bar {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 300ms ease-out;
  }
  .loading {
    font-size: 13px; color: var(--accent); font-style: italic;
    padding: var(--sp-2) var(--sp-3); background: var(--bg-card);
    border: 1px solid var(--accent); border-radius: var(--r-md);
    margin-bottom: var(--sp-3); display: none;
  }

  /* ── Recon panel ── */
  .recon {
    margin-bottom: var(--sp-3); padding: var(--sp-3);
    background: var(--bg-card); border: 1px solid var(--danger);
    border-radius: var(--r-md); border-inline-start: 3px solid var(--danger);
  }
  .recon h3 { font-size: 13px; color: var(--danger); margin-bottom: var(--sp-2); font-weight: 600; }
  .recon .summary { font-size: 14px; margin-bottom: var(--sp-2); }
  .recon .passage { font-size: 12px; color: var(--text-muted); margin: var(--sp-1) 0; }
  .recon label { display: block; margin: var(--sp-1) 0; font-size: 13px; cursor: pointer; }
  .recon .downstream { font-size: 12px; color: var(--warning); margin-top: var(--sp-2); }
  .recon .btn-row { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
  .recon .btn-row button {
    padding: var(--sp-1) var(--sp-3); border: none; border-radius: var(--r-sm);
    cursor: pointer; font-weight: 600; font-size: 12px;
    transition: opacity 100ms ease-out;
  }
  .recon .btn-row button:hover { opacity: 0.9; }
  .recon .apply-btn { background: var(--success); color: var(--accent-text); }
  .recon .discard-btn { background: var(--border); color: var(--text); }

  /* ── Choices ── */
  .choices { margin: var(--sp-3) 0; }
  .choice-btn {
    display: block; width: 100%; text-align: start;
    margin: var(--sp-1) 0; padding: var(--sp-2) var(--sp-3);
    background: var(--bg-card); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--r-md);
    cursor: pointer; font-family: var(--font-ui); font-size: 14px; line-height: 1.4;
    transition: background-color 100ms ease-out, border-color 100ms ease-out, transform 80ms ease-out;
  }
  .choice-btn:hover { background: var(--bg-page); border-color: var(--accent); }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Input area ── */
  .input-area { margin-top: var(--sp-3); }
  .brief {
    width: 100%; padding: var(--sp-2); background: var(--bg-input);
    color: var(--text); border: 1px solid var(--border); border-radius: var(--r-md);
    font-family: var(--font-ui); font-size: 13px; resize: vertical;
    min-height: 36px; margin-bottom: var(--sp-2);
    transition: border-color 100ms ease-out;
  }
  .brief:focus { border-color: var(--accent); outline: none; }
  .input-row { display: flex; gap: var(--sp-2); align-items: center; }
  .input-row input {
    flex: 1; padding: var(--sp-2) var(--sp-3); background: var(--bg-input);
    color: var(--text); border: 1px solid var(--border); border-radius: var(--r-md);
    font-family: var(--font-ui); font-size: 14px;
    transition: border-color 100ms ease-out;
  }
  .input-row input:focus { border-color: var(--accent); outline: none; }
  .input-row button {
    padding: var(--sp-2) var(--sp-4); background: var(--accent);
    color: var(--accent-text); border: none; border-radius: var(--r-md);
    cursor: pointer; font-weight: 600; font-size: 14px; min-height: 36px;
    transition: opacity 100ms ease-out, transform 80ms ease-out;
  }
  .input-row button:hover:not(:disabled) { opacity: 0.9; }
  .input-row button:active:not(:disabled) { transform: scale(0.97); }
  .input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  .input-row button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* ── Feedback ── */
  .feedback-row {
    margin-top: var(--sp-3); padding: var(--sp-3);
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-md);
  }
  .feedback-row .label {
    font-size: 11px; color: var(--text-muted); margin-bottom: var(--sp-2);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .feedback-row .rating-row {
    display: flex; gap: var(--sp-2); align-items: center; margin-bottom: var(--sp-2);
  }
  .feedback-row input[type="number"] {
    width: 52px; padding: var(--sp-1) var(--sp-2); background: var(--bg-input);
    color: var(--text); border: 1px solid var(--border); border-radius: var(--r-sm);
    font-family: var(--font-mono); font-size: 14px; text-align: center;
  }
  .feedback-row .submit-btn {
    padding: var(--sp-1) var(--sp-3); background: var(--success);
    color: var(--accent-text); border: none; border-radius: var(--r-sm);
    cursor: pointer; font-weight: 600; font-size: 12px;
    transition: opacity 100ms ease-out;
  }
  .feedback-row .submit-btn:hover { opacity: 0.9; }
  .feedback-row textarea {
    width: 100%; padding: var(--sp-2); background: var(--bg-input);
    color: var(--text); border: 1px solid var(--border); border-radius: var(--r-sm);
    font-family: var(--font-ui); font-size: 13px; resize: vertical; min-height: 44px;
  }
  .feedback-row textarea:focus { border-color: var(--accent); outline: none; }

  /* ── Checks ── */
  .checks {
    font-size: 12px; color: var(--warning); padding: var(--sp-2);
    background: var(--bg-card); border: 1px solid var(--warning);
    border-radius: var(--r-md); margin: var(--sp-2) 0;
  }

  /* ── Right pane (inspector) ── */
  .section { margin-bottom: var(--sp-4); }
  .section h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-muted); margin-bottom: var(--sp-2);
    padding-bottom: var(--sp-1); border-bottom: 1px solid var(--border);
    font-weight: 600; display: flex; align-items: center; justify-content: space-between;
  }
  .section h3 button {
    font-size: 10px; padding: 1px 6px; background: transparent;
    color: var(--text-muted); border: 1px solid var(--border);
    border-radius: 3px; cursor: pointer; text-transform: none; letter-spacing: 0;
    font-weight: 400;
  }
  .section h3 button:hover { color: var(--text); border-color: var(--accent); }
  .char { margin-bottom: var(--sp-3); }
  .char-name { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 2px; }
  .char-detail { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .state-row { font-size: 12px; margin-bottom: var(--sp-1); line-height: 1.5; }
  .state-row .label {
    color: var(--text-muted); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.04em; margin-inline-end: var(--sp-2);
  }
  .ev {
    font-size: 11px; color: var(--text-muted); margin: 2px 0;
    padding: 2px 0; border-bottom: 1px solid oklch(0.20 0.005 60);
    font-family: var(--font-mono); line-height: 1.4;
  }
  .ev:last-child { border-bottom: none; }
  .scene-list li {
    font-size: 12px; color: var(--text-muted); padding: 3px 0;
    cursor: pointer; transition: color 100ms ease-out; list-style: none;
  }
  .scene-list li:hover { color: var(--text); }
  .scene-list li.active { color: var(--accent); font-weight: 600; }
  .empty-state {
    font-size: 12px; color: var(--text-muted); font-style: italic;
    padding: var(--sp-2) 0;
  }
  .offline-msg {
    grid-column: 1 / -1; display: flex; align-items: center;
    justify-content: center; height: 100vh;
    font-size: 16px; color: var(--text-muted);
  }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; }
    .topbar { grid-column: 1; }
    .left { border-inline-end: none; border-bottom: 1px solid var(--border); }
    .page { max-width: 100%; }
    .scene { font-size: 17px; }
  }
  @media (max-width: 600px) {
    .scene { font-size: 16px; line-height: 1.6; }
    .topbar { flex-wrap: wrap; height: auto; padding: var(--sp-2); gap: var(--sp-2); }
    .topbar .nav { order: 3; width: 100%; justify-content: center; }
    .choice-btn { font-size: 13px; }
    .input-row { flex-direction: column; }
    .input-row button { width: 100%; }
  }

  .hidden { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); border: 0;
  }
</style>
</head>
<body>
<a href="#main" class="sr-only">Skip to main content</a>
<div class="layout">
  <header class="topbar">
    <span class="wordmark">Novel Studio</span>
    <span id="novelTitle" style="font-size:13px; color:var(--text-muted); margin-inline-start:var(--sp-2);"></span>
    <span id="genreLabel" style="font-size:11px; color:var(--text-muted); margin-inline-start:var(--sp-1); opacity:0.7;"></span>
    <select id="projectSelect" onchange="switchProject(this.value)" aria-label="Select novel project" class="project-select"></select>
    <button onclick="newProject()" class="new-btn" aria-label="New project">+ New</button>
    <button onclick="deleteProject()" class="new-btn" aria-label="Delete project" style="color:var(--danger); border-color:var(--danger);">Delete</button>
    <select id="branchSelect" onchange="switchBranch(this.value)" aria-label="Select branch" class="project-select" style="max-width:140px;"></select>
    <button onclick="newBranch()" class="new-btn" aria-label="New branch">Branch</button>
    <div class="nav">
      <button id="prevBtn" onclick="prevScene()" aria-label="Previous scene">◀ Prev</button>
      <select id="sceneSelect" onchange="viewScene(parseInt(this.value))" aria-label="Select scene"></select>
      <button id="nextBtn" onclick="nextScene()" aria-label="Next scene">Next ▶</button>
      <span class="nav-label" id="navLabel"></span>
    </div>
    <span class="status" id="status" aria-live="polite">Loading...</span>
  </header>

  <main class="left" id="main">
    <div id="loading" class="loading" role="status" aria-live="polite"></div>
    <div class="progress-wrap" id="pwrap"><div class="progress-bar" id="pbar"></div></div>

    <div id="recon" class="recon hidden">
      <h3>⚠ Reconciliation</h3>
      <div id="reconBody"></div>
      <div class="btn-row">
        <button class="apply-btn" onclick="applyProposals()">Apply accepted</button>
        <button class="discard-btn" onclick="discardRecon()">Discard all</button>
      </div>
    </div>

    <div class="page">
      <div class="page-toolbar">
        <button id="editBtn" onclick="toggleEdit()">Edit</button>
        <button id="saveBtn" class="save-btn" onclick="saveScene()" style="display:none;">Save</button>
        <button id="cancelEditBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
      </div>
      <div class="scene" id="scene"></div>
      <textarea class="scene-edit" id="sceneEdit"></textarea>
    </div>

    <div class="choices" id="choices"></div>
    <div class="checks hidden" id="checks"></div>

    <div class="input-area">
      <textarea class="brief" id="brief" rows="2" placeholder="Scene brief (optional): must-include, must-avoid, constraints..."></textarea>
      <div class="input-row">
        <input id="direction" placeholder="Director direction for next scene (or pick a choice above)" aria-label="Director direction" />
        <button onclick="generate()" id="genBtn">Generate</button>
      </div>
    </div>

    <div class="feedback-row" id="feedbackRow" style="display:none;">
      <div class="label">Rate this scene</div>
      <div class="rating-row">
        <input id="rating" type="number" min="1" max="10" value="7" aria-label="Rating 1 to 10" />
        <button class="submit-btn" onclick="submitFeedback()">Submit feedback</button>
      </div>
      <textarea id="fbText" rows="2" placeholder="What worked? What didn't? Voice, pacing, continuity..."></textarea>
    </div>
  </main>

  <aside class="right">
    <div class="section">
      <h3>World Lore <button onclick="toggleLoreEdit()">Edit</button></h3>
      <div id="loreView" style="font-size:12px; color:var(--text-muted); white-space:pre-wrap; max-height:200px; overflow:auto;"></div>
      <textarea id="loreEdit" style="display:none; width:100%; min-height:150px; padding:8px; background:var(--bg-input); color:var(--text); border:1px solid var(--accent); border-radius:var(--r-sm); font-family:var(--font-ui); font-size:12px; resize:vertical;"></textarea>
      <div id="loreBtns" style="display:none; gap:6px; margin-top:6px;">
        <button onclick="saveLore()" style="padding:3px 8px; background:var(--accent); color:var(--accent-text); border:none; border-radius:3px; cursor:pointer; font-size:11px; font-weight:600;">Save</button>
        <button onclick="cancelLoreEdit()" style="padding:3px 8px; background:transparent; color:var(--text-muted); border:1px solid var(--border); border-radius:3px; cursor:pointer; font-size:11px;">Cancel</button>
      </div>
    </div>
    <div class="section">
      <h3>Characters <button onclick="toggleCharsEdit()">Edit JSON</button></h3>
      <div id="chars"><div class="empty-state">No characters defined.</div></div>
      <textarea id="charsEdit" style="display:none; width:100%; min-height:150px; padding:8px; background:var(--bg-input); color:var(--text); border:1px solid var(--accent); border-radius:var(--r-sm); font-family:var(--font-mono); font-size:11px; resize:vertical;"></textarea>
      <div id="charsBtns" style="display:none; gap:6px; margin-top:6px;">
        <button onclick="saveChars()" style="padding:3px 8px; background:var(--accent); color:var(--accent-text); border:none; border-radius:3px; cursor:pointer; font-size:11px; font-weight:600;">Save</button>
        <button onclick="cancelCharsEdit()" style="padding:3px 8px; background:transparent; color:var(--text-muted); border:1px solid var(--border); border-radius:3px; cursor:pointer; font-size:11px;">Cancel</button>
      </div>
    </div>
    <div class="section">
      <h3>State <button onclick="rebuildState()">Rebuild</button></h3>
      <div id="state"><div class="empty-state">No state yet.</div></div>
    </div>
    <div class="section">
      <h3>Recent Events</h3>
      <div id="events"><div class="empty-state">No events recorded yet.</div></div>
    </div>
    <div class="section">
      <h3>Scenes</h3>
      <ul class="scene-list" id="scenes"></ul>
    </div>
  </aside>
</div>

<script>
/* ── Utilities ── */
function esc(v){ const d=document.createElement('div'); d.textContent=(v==null?'':String(v)); return d.innerHTML; }

/* ── State ── */
let lastChoices = [];
let timerInterval = null;
let startTime = 0;
let currentScene = 0;
let totalScenes = 0;
let feedbackScene = 0;
let editingScene = 0;
let genAbort = null;

/* ── Renderers ── */
function renderStatus(d){
  document.getElementById('status').textContent = `Scene ${d.scene_count}/${d.scene_count} · accepted`;
}
function renderScene(text){
  document.getElementById('scene').textContent = text || '';
}
function renderChoices(choices){
  lastChoices = choices || [];
  const el = document.getElementById('choices');
  el.innerHTML = '';
  lastChoices.forEach((c,i)=>{
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = (i+1)+'. '+c;
    b.onclick = ()=>{ document.getElementById('direction').value = c; };
    el.appendChild(b);
  });
}
function renderChars(chars){
  const el = document.getElementById('chars');
  el.innerHTML = '';
  if(!chars || !chars.length){ el.innerHTML = '<div class="empty-state">No characters defined.</div>'; return; }
  chars.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'char';
    d.innerHTML = `<div class="char-name">${esc(c.name)}</div><div class="char-detail">${esc(c.role)} — ${esc(c.voice)}</div>`;
    el.appendChild(d);
  });
}
function renderState(state){
  const el = document.getElementById('state');
  el.innerHTML = '';
  if(!state){ el.innerHTML = '<div class="empty-state">No state yet.</div>'; return; }
  for(const [id,s] of Object.entries(state)){
    const d = document.createElement('div');
    d.className = 'char';
    d.innerHTML = `<div class="char-name">${esc(id)}</div>
      <div class="state-row"><span class="label">Location</span> ${esc(s.location||'—')}</div>
      <div class="state-row"><span class="label">Inventory</span> ${esc((s.inventory||[]).join(', ')||'—')}</div>
      <div class="state-row"><span class="label">Status</span> ${esc(s.status||'—')}</div>`;
    el.appendChild(d);
  }
}
function renderEvents(events){
  const el = document.getElementById('events');
  el.innerHTML = '';
  if(!events || !events.length){ el.innerHTML = '<div class="empty-state">No events recorded yet.</div>'; return; }
  events.slice(-12).reverse().forEach(e=>{
    const d = document.createElement('div');
    d.className = 'ev';
    d.textContent = `[${e.type}] ${e.summary}`;
    el.appendChild(d);
  });
}
function renderScenes(list){
  const el = document.getElementById('scenes');
  el.innerHTML = '';
  if(!list || !list.length){ el.innerHTML = '<li class="empty-state">No scenes yet.</li>'; return; }
  list.forEach((s,i)=>{
    const li = document.createElement('li');
    li.textContent = s.replace('.md','');
    li.onclick = ()=> viewScene(i+1);
    if(i+1 === currentScene) li.classList.add('active');
    el.appendChild(li);
  });
}
function renderChecks(checks){
  const el = document.getElementById('checks');
  if(!checks || !checks.length){ el.classList.add('hidden'); el.innerHTML=''; return; }
  el.classList.remove('hidden');
  el.innerHTML = '<b style="color:var(--warning);">Checks:</b> ' + checks.map(c=>esc(c.character)+': '+esc(c.issue)).join('; ');
}

/* ── Scene navigation ── */
async function viewScene(n){
  if(n < 1 || n > totalScenes) return;
  currentScene = n;
  const r = await fetch('/api/scene/'+n);
  const d = await r.json();
  if(d.error){ alert(d.error); return; }
  renderScene(d.scene);
  renderChoices(d.choices || []);
  document.getElementById('sceneSelect').value = String(n);
  document.getElementById('navLabel').textContent = `Scene ${n} of ${totalScenes}`;
  document.getElementById('prevBtn').disabled = (n <= 1);
  document.getElementById('nextBtn').disabled = (n >= totalScenes);
  showFeedback(n);
}
function prevScene(){ if(currentScene>1) viewScene(currentScene-1); }
function nextScene(){ if(currentScene<totalScenes) viewScene(currentScene+1); }

/* ── Edit mode ── */
function toggleEdit(){
  if(editingScene){ cancelEdit(); return; }
  const scene = document.getElementById('scene').textContent;
  document.getElementById('sceneEdit').value = scene;
  document.getElementById('scene').style.display = 'none';
  document.getElementById('sceneEdit').style.display = 'block';
  document.getElementById('editBtn').style.display = 'none';
  document.getElementById('saveBtn').style.display = 'inline-block';
  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  editingScene = currentScene;
}
function cancelEdit(){
  document.getElementById('scene').style.display = 'block';
  document.getElementById('sceneEdit').style.display = 'none';
  document.getElementById('editBtn').style.display = 'inline-block';
  document.getElementById('saveBtn').style.display = 'none';
  document.getElementById('cancelEditBtn').style.display = 'none';
  editingScene = 0;
}
async function saveScene(){
  const text = document.getElementById('sceneEdit').value;
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const r = await fetch('/api/save_scene', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:editingScene, text})});
    let d;
    try { d = await r.json(); } catch(e){ throw new Error('Server returned non-JSON: ' + (await r.text())); }
    if(d.ok){
      renderScene(text);
      cancelEdit();
      if(d.dirty){ await checkEdits(); }
      else { /* no change detected */ }
    } else {
      alert('Save failed: '+(d.error||'unknown'));
    }
  } catch(e){ alert('Save failed: '+e); }
  finally { btn.disabled = false; btn.textContent = 'Save'; }
}

/* ── Feedback ── */
function showFeedback(n){ feedbackScene=n; document.getElementById('feedbackRow').style.display='block'; }
function submitFeedback(){
  const rating = parseInt(document.getElementById('rating').value) || 7;
  const text = document.getElementById('fbText').value.trim();
  fetch('/api/feedback', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:feedbackScene, rating, text})})
    .then(r=>r.json()).then(d=>{ if(d.ok){ alert('Feedback saved for scene '+feedbackScene); document.getElementById('fbText').value=''; } else { alert('Error saving feedback'); } })
    .catch(e=>alert('Request failed: '+e));
}

/* ── Reconciliation ── */
let currentRecon = null;
async function checkEdits(){
  const r = await fetch('/api/detect_edits');
  const d = await r.json();
  if(d.dirty && d.dirty.length){
    const r2 = await fetch('/api/reconcile', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:d.dirty[0]})});
    const prop = await r2.json();
    if(prop.none){ document.getElementById('recon').classList.add('hidden'); return; }
    if(prop.error){ alert('Reconcile error: '+prop.error); return; }
    currentRecon = prop;
    showRecon(prop);
  } else {
    document.getElementById('recon').classList.add('hidden');
    currentRecon = null;
  }
}
function showRecon(prop){
  const el = document.getElementById('reconBody');
  let html = `<div class="summary"><b>${esc(prop.summary||'')}</b></div>`;
  if(prop.passages_changed && prop.passages_changed.length){
    html += '<div class="passage">Changed: '+esc(prop.passages_changed.join('; '))+'</div>';
  }
  if(prop.proposals && prop.proposals.length){
    html += '<div style="margin-top:8px;">';
    prop.proposals.forEach((p,i)=>{
      html += `<label style="display:block;margin:4px 0;"><input type="checkbox" class="propcb" data-idx="${i}" ${p.auto_safe?'checked':''}> ${esc(p.description||p.op)} (conf ${esc(p.confidence||'?')})</label>`;
    });
    html += '</div>';
  }
  if(prop.downstream_scenes && prop.downstream_scenes.length){
    html += '<div class="downstream">May affect later scenes: '+esc(prop.downstream_scenes.join(', '))+'</div>';
  }
  el.innerHTML = html;
  document.getElementById('recon').classList.remove('hidden');
}
async function applyProposals(){
  if(!currentRecon) return;
  const proposals = currentRecon.proposals.map((p,i)=>{
    const cb = document.querySelector('.propcb[data-idx="'+i+'"]');
    return Object.assign({}, p, {accepted: cb ? cb.checked : false});
  }).filter(p=>p.accepted);
  if(!proposals.length){ alert('No proposals selected.'); return; }
  const r = await fetch('/api/apply_proposals', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({scene:currentRecon.scene, proposals, downstream_entities: currentRecon.downstream_entities||[]})});
  const d = await r.json();
  let msg = 'Applied '+d.applied+' retcon(s). State rebuilt.';
  if(d.flagged_scenes && d.flagged_scenes.length){ msg += ' May affect: '+d.flagged_scenes.join(', '); }
  alert(msg);
  currentRecon = null;
  document.getElementById('recon').classList.add('hidden');
  await loadStatus();
}
function discardRecon(){
  currentRecon = null;
  document.getElementById('recon').classList.add('hidden');
}

/* ── Generation ── */
async function generate(){
  if(editingScene){ cancelEdit(); }
  const dir = document.getElementById('direction').value.trim();
  if(!dir){ alert('Type a direction or pick a choice.'); return; }
  const brief = document.getElementById('brief').value.trim();
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = 'Generating...';
  document.getElementById('choices').innerHTML = '';
  startTimer();
  genAbort = new AbortController();
  const genTimeout = setTimeout(()=>{ if(genAbort) genAbort.abort(); }, 360000);
  try {
    const res = await fetch('/api/generate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({direction:dir, brief}),
      signal: genAbort.signal
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buffer += decoder.decode(value, {stream:true});
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for(const line of lines){
        if(!line.startsWith('data:')) continue;
        let obj;
        try { obj = JSON.parse(line.slice(5).trim()); } catch(e){ continue; }
        if(obj.type === 'stage'){
          document.getElementById('loading').textContent = `${obj.message} (${Math.round((Date.now()-startTime)/1000)}s elapsed)`;
          if(obj.progress) document.getElementById('pbar').style.width = obj.progress+'%';
        } else if(obj.type === 'done'){
          renderScene(obj.scene);
          renderChoices(obj.choices);
          renderState(obj.state);
          renderEvents(obj.events);
          renderChecks(obj.checks);
          const st = await (await fetch('/api/status')).json();
          renderStatus(st); renderScenes(st.scenes);
          totalScenes = st.scene_count;
          const sel = document.getElementById('sceneSelect');
          sel.innerHTML = '';
          for(let i=1;i<=totalScenes;i++){ const o=document.createElement('option'); o.value=i; o.textContent='Scene '+i; sel.appendChild(o); }
          currentScene = totalScenes;
          document.getElementById('sceneSelect').value = String(totalScenes);
          document.getElementById('navLabel').textContent = `Scene ${totalScenes} of ${totalScenes}`;
          showFeedback(totalScenes);
          document.getElementById('direction').value = '';
          document.getElementById('brief').value = '';
        } else if(obj.type === 'error'){
          alert('Error: '+obj.error);
        }
      }
    }
  } catch(e){
    if(e.name !== 'AbortError') alert('Request failed: '+e);
  }
  finally {
    clearTimeout(genTimeout);
    stopTimer();
    document.getElementById('genBtn').disabled = false;
    document.getElementById('genBtn').textContent = 'Generate';
    genAbort = null;
  }
}
function cancelGen(){ if(genAbort) genAbort.abort(); }

/* ── Timer ── */
function startTimer(){
  startTime = Date.now();
  const loading = document.getElementById('loading');
  const pwrap = document.getElementById('pwrap');
  const pbar = document.getElementById('pbar');
  loading.style.display = 'block';
  pwrap.style.display = 'block';
  pbar.style.width = '0%';
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    const elapsed = (Date.now()-startTime)/1000;
    loading.textContent = `Generating scene... ${Math.round(elapsed)}s elapsed. Please wait, do not click again.`;
    const pct = Math.min(95, (elapsed/90)*100);
    pbar.style.width = pct+'%';
  }, 1000);
}
function stopTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  document.getElementById('loading').style.display = 'none';
  document.getElementById('pwrap').style.display = 'none';
  document.getElementById('pbar').style.width = '0%';
}

/* ── Rebuild state ── */
async function rebuildState(){
  const r = await fetch('/api/rebuild_state', {method:'POST'});
  const d = await r.json();
  if(d.ok){ renderState(d.state); alert('State rebuilt from event log.'); }
  else { alert('Rebuild failed.'); }
}

/* ── Projects ── */
async function loadProjects(){
  const r = await fetch('/api/projects');
  const d = await r.json();
  const sel = document.getElementById('projectSelect');
  sel.innerHTML = '';
  (d.projects||[]).forEach(p=>{
    const o = document.createElement('option');
    o.value = p; o.textContent = p;
    if(p === d.active) o.selected = true;
    sel.appendChild(o);
  });
}
async function switchProject(name){
  const r = await fetch('/api/switch_project', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
  const d = await r.json();
  if(d.ok){ await loadBranches(); await loadStatus(); }
  else { alert('Switch failed: '+(d.error||'unknown')); await loadProjects(); }
}
async function newProject(){
  const name = prompt('New novel name:');
  if(!name) return;
  const lang = prompt('Language? (en = English, ar-eg = Arabic Egyptian dialect)', 'en');
  if(lang === null) return;
  const r = await fetch('/api/new_project', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, language: lang.trim()||'en'})});
  const d = await r.json();
  if(d.ok){ await loadProjects(); await loadStatus(); }
  else { alert('Create failed: '+(d.error||'unknown')); }
}
async function deleteProject(){
  const sel = document.getElementById('projectSelect');
  const name = sel.value;
  if(!name){ alert('No project selected.'); return; }
  if(!confirm('Delete novel "'+name+'"? This cannot be undone.')) return;
  const r = await fetch('/api/delete_project', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
  const d = await r.json();
  if(d.ok){ await loadProjects(); await loadStatus(); alert('Deleted "'+name+'".'); }
  else { alert('Delete failed: '+(d.error||'unknown')); }
}
async function loadBranches(){
  const r = await fetch('/api/branches');
  const d = await r.json();
  const sel = document.getElementById('branchSelect');
  sel.innerHTML = '';
  (d.branches||[]).forEach(b=>{
    const o = document.createElement('option');
    o.value = b; o.textContent = b;
    if(b === d.current) o.selected = true;
    sel.appendChild(o);
  });
}
async function switchBranch(name){
  const r = await fetch('/api/switch_branch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
  const d = await r.json();
  if(d.ok){ await loadStatus(); }
  else { alert('Switch failed: '+(d.error||'unknown')); await loadBranches(); }
}
async function newBranch(){
  const name = prompt('New branch name (no spaces):');
  if(!name) return;
  const r = await fetch('/api/create_branch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, from_scene: currentScene})});
  const d = await r.json();
  if(d.ok){ await loadBranches(); alert('Branch "'+name+'" created.'); }
  else { alert('Create failed: '+(d.error||'unknown')); }
}

/* ── Init ── */
async function loadLore(){
  const r = await fetch('/api/lore'); const d = await r.json();
  document.getElementById('loreView').textContent = d.content || '(no lore yet)';
}
async function toggleLoreEdit(){
  const view = document.getElementById('loreView');
  const edit = document.getElementById('loreEdit');
  const btns = document.getElementById('loreBtns');
  if(edit.style.display === 'block'){ cancelLoreEdit(); return; }
  const r = await fetch('/api/lore'); const d = await r.json();
  edit.value = d.content || '';
  view.style.display = 'none'; edit.style.display = 'block'; btns.style.display = 'flex';
}
function cancelLoreEdit(){
  document.getElementById('loreView').style.display = 'block';
  document.getElementById('loreEdit').style.display = 'none';
  document.getElementById('loreBtns').style.display = 'none';
}
async function saveLore(){
  const text = document.getElementById('loreEdit').value;
  const r = await fetch('/api/save_lore', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
  const d = await r.json();
  if(d.ok){ cancelLoreEdit(); loadLore(); alert('Lore saved.'); }
  else { alert('Save failed: '+(d.error||'unknown')); }
}
async function toggleCharsEdit(){
  const view = document.getElementById('chars');
  const edit = document.getElementById('charsEdit');
  const btns = document.getElementById('charsBtns');
  if(edit.style.display === 'block'){ cancelCharsEdit(); return; }
  const r = await fetch('/api/characters'); const d = await r.json();
  edit.value = d.content || '[]';
  view.style.display = 'none'; edit.style.display = 'block'; btns.style.display = 'flex';
}
function cancelCharsEdit(){
  document.getElementById('chars').style.display = 'block';
  document.getElementById('charsEdit').style.display = 'none';
  document.getElementById('charsBtns').style.display = 'none';
  loadStatus();
}
async function saveChars(){
  const text = document.getElementById('charsEdit').value;
  const r = await fetch('/api/save_characters', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})});
  const d = await r.json();
  if(d.ok){ cancelCharsEdit(); loadStatus(); alert('Characters saved.'); }
  else { alert('Save failed: '+(d.error||'unknown')); }
}
async function loadStatus(){
  const r = await fetch('/api/status');
  const d = await r.json();
  renderStatus(d);
  document.getElementById('novelTitle').textContent = d.project || '';
  const genreText = [d.genre, d.subgenre].filter(Boolean).join(' / ');
  document.getElementById('genreLabel').textContent = genreText ? '('+genreText+')' : '';
  if(d.language === 'ar-eg'){ document.documentElement.setAttribute('dir','rtl'); document.documentElement.setAttribute('lang','ar'); }
  else { document.documentElement.setAttribute('dir','ltr'); document.documentElement.setAttribute('lang','en'); }
  loadLore();
  renderChars(d.characters);
  renderState(d.state);
  renderScenes(d.scenes);
  totalScenes = d.scene_count;
  const sel = document.getElementById('sceneSelect');
  sel.innerHTML = '';
  for(let i=1;i<=totalScenes;i++){ const o=document.createElement('option'); o.value=i; o.textContent='Scene '+i; sel.appendChild(o); }
  if(totalScenes>0){ currentScene = totalScenes; viewScene(totalScenes); }
  checkEdits();
}
loadProjects().then(()=>{ loadBranches(); loadStatus(); });
</script>
