      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
      .just { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 48px; fill: #0D7C5F; letter-spacing: 0.08em; }
      .money { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 48px; fill: #1A1A2E; letter-spacing: 0.08em; }
    </style>
  </defs>
  <text class="just" x="100" y="50" text-anchor="middle">JUST</text>
